<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collatz coral</title>
<meta name="description" content="every collatz path drawn from 1, turning left on even and right on odd.">
<style>
  :root{
    --bg:#0d0d0f; --ink:#e8e6e1; --dim:#8b8880; --faint:#4a4843;
    --accent:#cba6f7; --warm:#d9c27a;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;
    font-size:14px;line-height:1.5;
    font-variant-ligatures:none;-webkit-font-variant-ligatures:none;
    display:flex;flex-direction:column;min-height:100%;
    overflow:hidden;
  }
  /* ---- top identity bar ---- */
  .top{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:26px 32px 0;flex:0 0 auto;gap:16px;
  }
  .name{font-size:14px;letter-spacing:.01em}
  .name b{font-weight:700;color:var(--ink)}
  .name span{color:var(--dim);font-weight:400}
  .modes{display:flex;gap:14px;align-items:baseline;font-size:14px}
  .modes button{
    background:none;border:0;padding:0;margin:0;cursor:pointer;
    font:inherit;color:var(--faint);
    transition:color .25s var(--ease);
  }
  .modes button:hover{color:var(--dim)}
  .modes button[aria-selected="true"]{color:var(--warm)}
  .modes .sep{color:var(--faint);opacity:.5}
  .modes button:focus-visible,.ctl button:focus-visible,input:focus-visible{
    outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;
  }
  /* ---- the stage: the thing itself, taking the room ---- */
  .stage{
    flex:1 1 auto;position:relative;min-height:0;
    margin:18px 32px 0;
  }
  canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    opacity:0;transition:opacity .45s var(--ease);
  }
  canvas.on{opacity:1}
  /* ---- naked stats, no boxes ---- */
  .stats{
    flex:0 0 auto;display:flex;gap:38px;padding:20px 32px 0;flex-wrap:wrap;
  }
  .stat .v{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;
    font-variant-numeric:tabular-nums}
  .stat .k{font-size:11px;color:var(--dim);margin-top:2px}
  /* ---- quiet controls ---- */
  .ctl{
    flex:0 0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    padding:18px 32px 0;color:var(--dim);font-size:12px;
  }
  .ctl label{display:flex;gap:8px;align-items:center;white-space:nowrap}
  .ctl input[type=number]{
    width:96px;background:transparent;border:0;border-bottom:1px solid var(--faint);
    color:var(--ink);font:inherit;font-size:13px;padding:2px 0;
    transition:border-color .25s var(--ease);
  }
  .ctl input[type=number]:focus{outline:none;border-bottom-color:var(--accent)}
  .ctl input[type=range]{
    -webkit-appearance:none;appearance:none;width:130px;height:2px;
    background:var(--faint);border-radius:2px;cursor:pointer;
  }
  .ctl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--ink);transition:transform .18s var(--ease);
  }
  .ctl input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}
  .ctl input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--ink);
  }
  .ctl button{
    background:none;border:0;padding:0;font:inherit;color:var(--dim);cursor:pointer;
    transition:color .2s var(--ease),transform .12s var(--ease);
  }
  .ctl button:hover{color:var(--ink)}
  .ctl button:active{transform:scale(.96)}
  .num{color:var(--ink);font-variant-numeric:tabular-nums}
  /* ---- one dim line at the bottom ---- */
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;gap:16px;
    padding:20px 32px 22px;color:var(--faint);font-size:11px;flex-wrap:wrap;
  }
  .foot a{color:var(--faint);text-decoration:none;border-bottom:1px solid transparent;
    transition:color .2s var(--ease),border-color .2s var(--ease)}
  .foot a:hover{color:var(--dim);border-bottom-color:var(--faint)}
  .seq{
    color:var(--faint);font-size:11px;line-height:1.8;word-break:break-all;
    max-height:2.9em;overflow:hidden;margin:0;
  }
  .seq b{color:var(--accent)}
  .sm{display:none}
  @media(max-width:700px){
    .lg{display:none} .sm{display:inline}
    .modes{gap:10px}
    .name span{display:none}

    .top,.stats,.ctl,.foot{padding-left:18px;padding-right:18px}
    .stage{margin-left:18px;margin-right:18px}
    .stats{gap:22px}
    .stat .v{font-size:18px}
    body{overflow:auto}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="top">
  <div class="name"><b>collatz</b> <span>coral</span></div>
  <div class="modes" role="tablist" aria-label="view">
    <button role="tab" id="m-coral"  aria-selected="true"  data-mode="coral">coral</button>
    <span class="sep">/</span>
    <button role="tab" id="m-one"    aria-selected="false" data-mode="one"><span class="lg">one number</span><span class="sm">one</span></button>
    <span class="sep">/</span>
    <button role="tab" id="m-scan"   aria-selected="false" data-mode="scan"><span class="lg">every number</span><span class="sm">all</span></button>
  </div>
</div>

<div class="stage">
  <canvas id="coral" class="on"></canvas>
  <canvas id="one"></canvas>
  <canvas id="scatter"></canvas>
</div>

<div class="stats" id="stats" aria-live="polite"></div>

<div class="ctl" id="ctl"></div>

<div class="foot">
  <p class="seq" id="seq"></p>
  <a href="https://github.com/xevrion/collatz-coral">source</a>
</div>

<script>
const $=s=>document.querySelector(s);

// ---------- the rule ----------
function collatz(n){
  const seq=[n];
  while(n!==1){ n = n%2===0 ? n/2 : 3*n+1; seq.push(n); }
  return seq;
}
// memoized step counts so scanning a million is instant
const stepCache=new Map([[1,0]]);
function stepsTo1(n){
  const path=[];
  while(!stepCache.has(n)){ path.push(n); n = n%2===0 ? n/2 : 3*n+1; }
  let s=stepCache.get(n);
  for(let i=path.length-1;i>=0;i--){ s++; stepCache.set(path[i],s); }
  return path.length?stepCache.get(path[0]):s;
}

const state={mode:"coral", n:27, limit:10000, count:3000, angle:8};
function fit(c){
  const r=c.getBoundingClientRect(), d=devicePixelRatio||1;
  c.width=Math.max(320,Math.floor(r.width*d));
  c.height=Math.max(200,Math.floor(r.height*d));
  return c.getContext("2d");
}
const fmt=x=>x.toLocaleString();
function setStats(items){
  $("#stats").innerHTML=items.map(([v,k])=>
    `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
}

// ---------- coral ----------
function grow(){
  const c=$("#coral"),ctx=fit(c),W=c.width,H=c.height,d=devicePixelRatio||1;
  ctx.clearRect(0,0,W,H);
  const evenTurn=state.angle*Math.PI/180, oddTurn=-state.angle*Math.PI/180*1.9;
  const stepLen=Math.max(2,H/120);
  ctx.lineWidth=0.8*d; ctx.strokeStyle="rgba(203,166,247,.10)";
  let deepest=0;
  for(let n=1;n<=state.count;n++){
    const seq=collatz(n).reverse();
    if(seq.length>deepest)deepest=seq.length;
    let x=W*0.12,y=H*0.92,a=-Math.PI/2.2;
    ctx.beginPath();ctx.moveTo(x,y);
    for(let i=1;i<seq.length;i++){
      a += seq[i]%2===0 ? evenTurn : oddTurn;
      x+=Math.cos(a)*stepLen; y+=Math.sin(a)*stepLen;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  setStats([[fmt(state.count),"paths drawn"],[state.angle+"&deg;","turn angle"],
            [fmt(deepest),"longest path"]]);
  $("#seq").innerHTML="";
}

// ---------- one number ----------
function trace(){
  const seq=collatz(state.n);
  const c=$("#one"),ctx=fit(c),W=c.width,H=c.height,d=devicePixelRatio||1;
  const pad=14*d;
  ctx.clearRect(0,0,W,H);
  const mx=Math.max(...seq);
  ctx.strokeStyle="#cba6f7";ctx.lineWidth=1.5*d;ctx.beginPath();
  seq.forEach((v,i)=>{
    const x=pad+(W-2*pad)*i/Math.max(1,seq.length-1);
    const y=H-pad-(H-2*pad)*(Math.log(v)/Math.log(mx||2));
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
  setStats([[fmt(seq.length-1),"steps to 1"],[fmt(mx),"peak"],
            [fmt(seq.filter(x=>x%2===1&&x!==1).length),"odd steps"]]);
  $("#seq").innerHTML=seq.map((x,i)=>i===seq.length-1?`<b>${x}</b>`:x).join(" -> ");
}

// ---------- every number ----------
function scan(){
  const limit=state.limit, t0=performance.now();
  let bestS=0,bestSn=1,bestP=0,bestPn=1;
  const steps=new Array(limit+1);
  for(let n=1;n<=limit;n++){ const s=stepsTo1(n); steps[n]=s; if(s>bestS){bestS=s;bestSn=n;} }
  for(let n=1;n<=limit;n++){ let x=n,p=n; while(x!==1){ x=x%2===0?x/2:3*x+1; if(x>p)p=x; } if(p>bestP){bestP=p;bestPn=n;} }
  const ms=performance.now()-t0;
  const c=$("#scatter"),ctx=fit(c),W=c.width,H=c.height,d=devicePixelRatio||1,pad=12*d;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="rgba(217,194,122,.85)";
  const r=Math.max(1,1.7*d*Math.min(1,3000/limit));
  for(let n=1;n<=limit;n++){
    const x=pad+(W-2*pad)*n/limit, y=H-pad-(H-2*pad)*steps[n]/bestS;
    ctx.fillRect(x,y,r,r);
  }
  setStats([[fmt(bestS),"longest path"],[fmt(bestP),"highest climb"],
            [ms<1000?ms.toFixed(0)+" ms":(ms/1000).toFixed(2)+" s","scan time"]]);
  $("#seq").innerHTML=`<b>${fmt(bestSn)}</b> takes the longest. <b>${fmt(bestPn)}</b> climbs the highest.`;
}

// ---------- controls per mode, only what that mode needs ----------
function renderCtl(){
  const m=state.mode, el=$("#ctl");
  if(m==="coral"){
    el.innerHTML=`
      <label>paths <input type="range" id="count" min="100" max="20000" step="100" value="${state.count}"><span class="num" id="countv">${fmt(state.count)}</span></label>
      <label>angle <input type="range" id="angle" min="2" max="30" step="1" value="${state.angle}"><span class="num" id="anglev">${state.angle}&deg;</span></label>
      <button id="save">save png</button>`;
    const live=()=>{ state.count=+$("#count").value; state.angle=+$("#angle").value;
      $("#countv").textContent=fmt(state.count); $("#anglev").innerHTML=state.angle+"&deg;"; };
    // respond while dragging, redraw on release so it stays smooth
    $("#count").addEventListener("input",live);
    $("#angle").addEventListener("input",live);
    $("#count").addEventListener("change",grow);
    $("#angle").addEventListener("change",grow);
    $("#save").onclick=()=>{const a=document.createElement("a");
      a.download="collatz-coral.png";a.href=$("#coral").toDataURL();a.click();};
  } else if(m==="one"){
    el.innerHTML=`<label>start <input type="number" id="n" min="1" value="${state.n}"></label>
      <button id="rand">random</button>`;
    const go=()=>{ state.n=Math.max(1,Math.floor(+$("#n").value||1)); trace(); };
    $("#n").addEventListener("change",go);
    $("#n").addEventListener("keydown",e=>{ if(e.key==="Enter")go(); });
    $("#rand").onclick=()=>{ state.n=1+Math.floor(Math.random()*1e6); $("#n").value=state.n; trace(); };
  } else {
    el.innerHTML=`<label>up to <input type="number" id="limit" min="2" value="${state.limit}"></label>
      <button id="go">scan</button>`;
    const go=()=>{ state.limit=Math.max(2,Math.floor(+$("#limit").value||2)); scan(); };
    $("#go").onclick=go;
    $("#limit").addEventListener("keydown",e=>{ if(e.key==="Enter")go(); });
  }
}

const canvases={coral:$("#coral"),one:$("#one"),scan:$("#scatter")};
function show(mode){
  state.mode=mode;
  for(const [k,c] of Object.entries(canvases)) c.classList.toggle("on",k===mode);
  document.querySelectorAll(".modes button").forEach(b=>
    b.setAttribute("aria-selected", b.dataset.mode===mode ? "true":"false"));
  renderCtl();
  ({coral:grow,one:trace,scan:scan})[mode]();
  history.replaceState(null,"","#"+mode);
}
// react on pointer down, not on click, so it feels instant
document.querySelectorAll(".modes button").forEach(b=>{
  b.addEventListener("pointerdown",()=>show(b.dataset.mode));
  b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();show(b.dataset.mode);} });
});

let rt; addEventListener("resize",()=>{ clearTimeout(rt);
  rt=setTimeout(()=>({coral:grow,one:trace,scan:scan})[state.mode](),150); });

const start=(location.hash||"").slice(1);
show(["coral","one","scan"].includes(start)?start:"coral");
</script>
</body>
</html>
