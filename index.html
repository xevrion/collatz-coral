<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collatz coral</title>
<meta name="description" content="collatz paths printed as cyanotype specimen plates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a2744;          /* prussian blue, the exposed paper */
    --deep:#061a2e;         /* shadowed corners */
    --print:#e9f1f6;        /* where the specimen blocked the light */
    --pale:#a9c6d9;         /* half tone */
    --faint:#5b829d;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--print);
    font-family:"EB Garamond",Georgia,"Times New Roman",serif;
    font-size:17px;line-height:1.45;
    display:flex;flex-direction:column;min-height:100%;overflow:hidden;
  }
  /* the sheet: uneven exposure, like a real sun print */
  .sheet{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.07), transparent 55%),
      radial-gradient(130% 100% at 78% 88%, rgba(0,0,0,.30), transparent 60%);
    mix-blend-mode:soft-light;
  }
  /* paper grain */
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.16;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .plate{flex:1 1 auto;position:relative;min-height:0;margin:0}
  canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    opacity:0;transition:opacity .5s var(--ease);
  }
  canvas.on{opacity:1}
  /* the specimen label, pinned like a herbarium sheet */
  .label{
    position:relative;z-index:4;flex:0 0 auto;
    display:grid;grid-template-columns:1fr auto;gap:10px 28px;align-items:end;
    padding:0 clamp(20px,4vw,52px) clamp(18px,3vw,34px);
  }
  .latin{
    font-style:italic;font-size:clamp(23px,3.1vw,34px);line-height:1.1;
    letter-spacing:-.005em;margin:0;
  }
  .latin em{font-style:normal}
  .reading{
    margin:.45em 0 0;color:var(--pale);font-size:clamp(14px,1.5vw,16.5px);
    max-width:56ch;
  }
  .reading b{color:var(--print);font-weight:500;font-variant-numeric:tabular-nums}
  /* plate numerals, doubling as the view switch */
  .plates{display:flex;gap:16px;align-items:baseline;justify-self:end}
  .plates button{
    background:none;border:0;padding:2px 0;margin:0;cursor:pointer;
    font-family:inherit;font-size:20px;color:var(--faint);
    border-bottom:1px solid transparent;
    transition:color .3s var(--ease),border-color .3s var(--ease);
  }
  .plates button:hover{color:var(--pale)}
  .plates button[aria-selected="true"]{color:var(--print);border-bottom-color:var(--print)}
  /* the instrument row, set like a printer's note */
  .dial{
    position:relative;z-index:4;flex:0 0 auto;
    display:flex;gap:clamp(16px,2.4vw,34px);align-items:center;flex-wrap:wrap;
    padding:0 clamp(20px,4vw,52px) clamp(20px,3vw,30px);
    color:var(--faint);font-size:15px;
  }
  .dial label{display:flex;gap:10px;align-items:center;white-space:nowrap;min-width:0}
  .dial .v{color:var(--print);font-variant-numeric:tabular-nums;min-width:3.4em}
  .dial input[type=range]{
    -webkit-appearance:none;appearance:none;width:clamp(90px,13vw,170px);height:1px;
    background:var(--faint);cursor:pointer;
  }
  .dial input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--print);border:0;
    transition:transform .16s var(--ease);
  }
  .dial input[type=range]:active::-webkit-slider-thumb{transform:scale(1.4)}
  .dial input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;background:var(--print);
  }
  .dial input[type=number]{
    width:7.5em;background:none;border:0;border-bottom:1px solid var(--faint);
    color:var(--print);font-family:inherit;font-size:16px;padding:1px 0;
    font-variant-numeric:tabular-nums;
    transition:border-color .3s var(--ease);
  }
  .dial input[type=number]:focus{outline:none;border-bottom-color:var(--print)}
  .dial button{
    background:none;border:0;padding:0;font-family:inherit;font-size:15px;
    color:var(--faint);cursor:pointer;font-style:italic;
    transition:color .25s var(--ease);
  }
  .dial button:hover{color:var(--print)}
  .dial .rule{flex:1 1 40px;height:1px;background:var(--faint);opacity:.35;min-width:0}
  .cite{color:var(--faint);font-size:13.5px;font-style:italic;white-space:nowrap}
  .cite a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(91,130,157,.45)}
  .cite a:hover{color:var(--pale)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--print);outline-offset:4px}
  @media(max-width:720px){
    body{overflow:auto}
    .label{grid-template-columns:1fr;gap:14px}
    .plates{justify-self:start}
    .dial .rule{display:none}
    .cite{white-space:normal}
    .dial{gap:12px 16px}
    .dial label{white-space:normal;flex-wrap:wrap}
    .dial input[type=range]{width:clamp(70px,34vw,150px)}
    .dial .v{min-width:0}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="plate">
  <canvas id="coral" class="on"></canvas>
  <canvas id="one"></canvas>
  <canvas id="scatter"></canvas>
</div>
<div class="sheet"></div>
<div class="grain"></div>

<div class="label">
  <div>
    <p class="latin" id="latin"></p>
    <p class="reading" id="reading" aria-live="polite"></p>
  </div>
  <div class="plates" role="tablist" aria-label="plate">
    <button role="tab" data-mode="coral" aria-selected="true">I</button>
    <button role="tab" data-mode="one" aria-selected="false">II</button>
    <button role="tab" data-mode="scan" aria-selected="false">III</button>
  </div>
</div>

<div class="dial" id="dial"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=x=>x.toLocaleString();

// ---------- the rule ----------
function collatz(n){
  const seq=[n];
  while(n!==1){ n = n%2===0 ? n/2 : 3*n+1; seq.push(n); }
  return seq;
}
const stepCache=new Map([[1,0]]);
function stepsTo1(n){
  const path=[];
  while(!stepCache.has(n)){ path.push(n); n = n%2===0 ? n/2 : 3*n+1; }
  let s=stepCache.get(n);
  for(let i=path.length-1;i>=0;i--){ s++; stepCache.set(path[i],s); }
  return path.length?stepCache.get(path[0]):s;
}

const state={mode:"coral", n:27, limit:10000, count:3000, angle:8};

function fit(c){
  const r=c.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  c.width=Math.max(320,Math.floor(r.width*d));
  c.height=Math.max(220,Math.floor(r.height*d));
  const ctx=c.getContext("2d");
  // lay the blue down on the canvas itself so a saved print looks right
  const g=ctx.createLinearGradient(0,0,c.width,c.height);
  g.addColorStop(0,"#0b2b4a"); g.addColorStop(.55,"#0a2744"); g.addColorStop(1,"#061a2e");
  ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);
  return {ctx,W:c.width,H:c.height,d};
}
function say(latin,reading){
  $("#latin").innerHTML=latin;
  $("#reading").innerHTML=reading;
}

// ---------- plate I, the algae ----------
function grow(){
  const {ctx,W,H,d}=fit($("#coral"));
  const evenTurn=state.angle*Math.PI/180, oddTurn=-state.angle*Math.PI/180*1.9;
  const stepLen=Math.max(2,H/125);
  let deepest=0;
  // two passes: a soft halo, then the crisp print. that is what gives the bloom
  for(const pass of [{w:3.1*d,a:.045,blur:true},{w:.85*d,a:.16,blur:false}]){
    ctx.lineWidth=pass.w;
    ctx.strokeStyle=`rgba(233,241,246,${pass.a})`;
    for(let n=1;n<=state.count;n++){
      const seq=collatz(n).reverse();
      if(seq.length>deepest)deepest=seq.length;
      let x=W*0.14,y=H*0.94,a=-Math.PI/2.25;
      ctx.beginPath();ctx.moveTo(x,y);
      for(let i=1;i<seq.length;i++){
        a += seq[i]%2===0 ? evenTurn : oddTurn;
        x+=Math.cos(a)*stepLen; y+=Math.sin(a)*stepLen;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }
  say('Collatz <em>coralliformis</em>',
      `every path from <b>1</b> to <b>${fmt(state.count)}</b>, run backwards from the root and turned <b>${state.angle}&deg;</b> left on each even step, right on each odd. the longest runs <b>${fmt(deepest)}</b> steps. nothing here was drawn by hand.`);
}

// ---------- plate II, a single frond ----------
function trace(){
  const {ctx,W,H,d}=fit($("#one"));
  const seq=collatz(state.n), pad=Math.min(W,H)*0.07, mx=Math.max(...seq);
  const pt=i=>{
    const x=pad+(W-2*pad)*i/Math.max(1,seq.length-1);
    const y=H-pad-(H-2*pad)*(Math.log(seq[i])/Math.log(mx||2));
    return [x,y];
  };
  // dropped spores under the curve, so the plate is not just a line
  ctx.fillStyle="rgba(233,241,246,.13)";
  for(let i=0;i<seq.length;i++){
    const [x,y]=pt(i);
    ctx.beginPath();ctx.arc(x,y,1.6*d,0,7);ctx.fill();
    ctx.fillRect(x-.35*d,y,.7*d,H-pad-y);
  }
  for(const pass of [{w:5*d,a:.07},{w:1.5*d,a:.92}]){
    ctx.strokeStyle=`rgba(233,241,246,${pass.a})`;ctx.lineWidth=pass.w;
    ctx.beginPath();
    seq.forEach((_,i)=>{ const [x,y]=pt(i); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
  }
  say(`Specimen no. <em>${fmt(state.n)}</em>`,
      `climbs to <b>${fmt(mx)}</b>, falls to <b>1</b> in <b>${fmt(seq.length-1)}</b> steps, <b>${fmt(seq.filter(x=>x%2===1&&x!==1).length)}</b> of them odd. height is logarithmic, else the peak would not fit on the sheet.`);
}

// ---------- plate III, the scattering ----------
function scan(){
  const limit=state.limit, t0=performance.now();
  let bestS=0,bestSn=1,bestP=0,bestPn=1;
  const steps=new Array(limit+1);
  for(let n=1;n<=limit;n++){ const s=stepsTo1(n); steps[n]=s; if(s>bestS){bestS=s;bestSn=n;} }
  for(let n=1;n<=limit;n++){ let x=n,p=n; while(x!==1){ x=x%2===0?x/2:3*x+1; if(x>p)p=x; } if(p>bestP){bestP=p;bestPn=n;} }
  const ms=performance.now()-t0;
  const {ctx,W,H,d}=fit($("#scatter"));
  const pad=Math.min(W,H)*0.07;
  ctx.fillStyle="rgba(233,241,246,.62)";
  const r=Math.max(.9,1.5*d*Math.min(1,4000/limit));
  for(let n=1;n<=limit;n++){
    const x=pad+(W-2*pad)*n/limit, y=H-pad-(H-2*pad)*steps[n]/bestS;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  say('Sporae <em>collatzianae</em>',
      `every number to <b>${fmt(limit)}</b>, placed by how many steps it needs. <b>${fmt(bestSn)}</b> takes the longest at <b>${fmt(bestS)}</b>, <b>${fmt(bestPn)}</b> climbs highest at <b>${fmt(bestP)}</b>. the bands are real, numbers that fall into a shared path share a count. printed in <b>${ms<1000?ms.toFixed(0)+" ms":(ms/1000).toFixed(2)+" s"}</b>.`);
}

// ---------- the dial, only what this plate needs ----------
const cite='<span class="cite">after Atkins, <em>Photographs of British Algae</em>, 1843 &middot; <a href="https://github.com/xevrion/collatz-coral">source</a></span>';
function renderDial(){
  const m=state.mode, el=$("#dial");
  if(m==="coral"){
    el.innerHTML=`
      <label>specimens <input type="range" id="count" min="100" max="20000" step="100" value="${state.count}"><span class="v" id="countv">${fmt(state.count)}</span></label>
      <label>turn <input type="range" id="angle" min="2" max="30" step="1" value="${state.angle}"><span class="v" id="anglev">${state.angle}&deg;</span></label>
      <button id="save">save the print</button><span class="rule"></span>${cite}`;
    const live=()=>{
      state.count=+$("#count").value; state.angle=+$("#angle").value;
      $("#countv").textContent=fmt(state.count);
      $("#anglev").innerHTML=state.angle+"&deg;";
    };
    $("#count").addEventListener("input",live);
    $("#angle").addEventListener("input",live);
    $("#count").addEventListener("change",grow);
    $("#angle").addEventListener("change",grow);
    $("#save").onclick=()=>{
      const a=document.createElement("a");
      a.download="collatz-cyanotype.png"; a.href=$("#coral").toDataURL(); a.click();
    };
  } else if(m==="one"){
    el.innerHTML=`<label>specimen <input type="number" id="n" min="1" value="${state.n}"></label>
      <button id="rand">take another</button><span class="rule"></span>${cite}`;
    const go=()=>{ state.n=Math.max(1,Math.floor(+$("#n").value||1)); trace(); };
    $("#n").addEventListener("change",go);
    $("#n").addEventListener("keydown",e=>{ if(e.key==="Enter")go(); });
    $("#rand").onclick=()=>{ state.n=1+Math.floor(Math.random()*1e6); $("#n").value=state.n; trace(); };
  } else {
    el.innerHTML=`<label>up to <input type="number" id="limit" min="2" value="${state.limit}"></label>
      <button id="go">expose</button><span class="rule"></span>${cite}`;
    const go=()=>{ state.limit=Math.max(2,Math.floor(+$("#limit").value||2)); scan(); };
    $("#go").onclick=go;
    $("#limit").addEventListener("keydown",e=>{ if(e.key==="Enter")go(); });
  }
}

const draw={coral:grow,one:trace,scan:scan};
const canvases={coral:$("#coral"),one:$("#one"),scan:$("#scatter")};
function show(mode){
  state.mode=mode;
  for(const [k,c] of Object.entries(canvases)) c.classList.toggle("on",k===mode);
  document.querySelectorAll(".plates button").forEach(b=>
    b.setAttribute("aria-selected", b.dataset.mode===mode ? "true":"false"));
  renderDial();
  draw[mode]();
  history.replaceState(null,"","#"+mode);
}
document.querySelectorAll(".plates button").forEach(b=>{
  b.addEventListener("pointerdown",()=>show(b.dataset.mode));
  b.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){e.preventDefault();show(b.dataset.mode);}
  });
});

let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>draw[state.mode](),150); });

const start=(location.hash||"").slice(1);
show(["coral","one","scan"].includes(start)?start:"coral");
</script>
</body>
</html>
