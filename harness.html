<iframe id=f src="index.html" width=1000 height=900></iframe>
<div id=res>waiting</div>
<script>
document.getElementById("f").addEventListener("load", async () => {
  const d = document.getElementById("f").contentDocument;
  await new Promise(r => setTimeout(r, 1500));
  const g = id => d.getElementById(id).textContent.trim();
  // canvas actually drew? sample coral pixels for non-background
  const c = d.getElementById("coral"), ctx = c.getContext("2d");
  const px = ctx.getImageData(0,0,c.width,c.height).data;
  let lit=0; for(let i=0;i<px.length;i+=4){ if(px[i]>30||px[i+1]>30||px[i+2]>60) lit++; }
  const one = d.getElementById("one"), octx = one.getContext("2d");
  const opx = octx.getImageData(0,0,one.width,one.height).data;
  let olit=0; for(let i=0;i<opx.length;i+=4){ if(opx[i+3]>0) olit++; }
  document.getElementById("res").textContent = JSON.stringify({
    steps27: g("steps"), peak27: g("peak"), odds27: g("odds"),
    champSteps: g("cSteps"), champPeak: g("cPeak"), champText: g("champ"),
    coralLitPixels: lit, hailstoneLitPixels: olit,
    seqStart: g("seq").slice(0,40)
  });
});
</script>
